# Translator — non-secret configuration
# API keys are in .env file (not here — never commit API keys!)

# LLM base URL — supports any OpenAI-compatible provider.
# OpenAI:      https://api.openai.com/v1
# Groq Cloud:  https://api.groq.com/openai/v1
LLM_BASE_URL: "https://api.groq.com/openai/v1"

# LLM model — supports any model on the configured base_url.
# gpt-oss-120b (F10.1): лучше качество рассуждений, TTFT тот же (~0.7s),
# полный ответ дольше (~6s vs ~1.5s) — стриминг частичного ответа сглаживает.
# Если JSON-формат начнёт ломаться (у 120b follow слабее) — включить
# LLM_JSON_MODE=response_format.
LLM_MODEL: "openai/gpt-oss-120b"

# Reasoning-effort reasoning-модели (gpt-oss/qwen): low | medium | high.
# Пусто — параметр не отправляется. Для gpt-oss-20b на Groq рекомендуется low
# (F7): быстрее полный ответ при том же качестве коротких подсказок.
LLM_REASONING_EFFORT: "low"

# Fallback-цепочка моделей на ТОМ ЖЕ провайдере (та же base_url/API key):
# при исчерпании ретраев основной модели (429/сбой) запрос повторяется на
# следующей из списка. Полные имена моделей (env-вариант LLM_FALLBACK_MODELS —
# строка через запятую):
# LLM_FALLBACK_MODELS:
#   - "qwen/qwen3.6-27b"

# Резервные провайдеры (F10.1) — страховка от глобального контеншна Groq
# free tier (429 приходит и без нашей амплификации). Используются после
# LLM_FALLBACK_MODELS. API key — в .env (OPENROUTER_API_KEY), не здесь.
# Отсутствующий env-ключ: резерв пропускается с warning, старт не валим.
# LLM_FALLBACKS:
#   - base_url: "https://openrouter.ai/api/v1"
#     model: "meta-llama/llama-3.3-70b-instruct:free"
#     api_key_env: "OPENROUTER_API_KEY"

# Бюджет одной генерации ответа ("12s", "1m30s"). Пусто — дефолт 12s;
# "0" — без лимита (не рекомендуется).
# LLM_ANSWER_TIMEOUT: "12s"

# Режим JSON-вывода ответов (F7):
#   prompt           — JSON-инструкция в system-промпте + парсинг JSON-first
#                      со строковым fallback (дефолт; работает и для
#                      reasoning-моделей);
#   response_format  — то же + response_format json_object (жёсткий режим
#                      для non-reasoning моделей);
#   off              — старый строковый формат «EN: … | RU: …».
# LLM_JSON_MODE: "prompt"

# Target language for Gladia translation (ISO 639-1)
TARGET_LANG: "ru"
# Source language for Gladia (ISO 639-1)
SOURCE_LANG: "en"

# Session log directory
LOG_DIR: "./logs"

# Audio device names — edit to match your setup
# Leave empty to use system defaults, or set specific device names:
#   LOOPBACK_DEVICE: "CABLE Input (VB-Audio Virtual Cable)"
#   MIC_DEVICE:     "Microphone (Realtek High Definition Audio)"
LOOPBACK_DEVICE: ""
MIC_DEVICE: ""

# Save raw PCM audio chunks to disk (audio/ directory under log_dir).
# Default false - set true to enable for debugging or post-session review.
SAVE_AUDIO: false

# Log interim (partial) STT events to the session log. Default false:
# only final EndOfTurn transcripts are written (interims are growing
# prefixes of the same phrase - diagnostic noise, ~61% of log lines).
# Set true to restore the old verbose behavior.
LOG_INTERIM: false

# System prompt (правила генерации ответа) — вынесен из кода в обычный текстовый
# файл: правки применяются при следующем старте БЕЗ перекомпиляции.
# Плейсхолдеры: {{SRC_TAG}} и {{TGT_TAG}} — подставляются SOURCE_LANG/TARGET_LANG
# в верхнем регистре (EN, RU, DE). Если файла нет — он создаётся при старте из
# встроенного дефолта (go:embed) и работа продолжается. Пустой путь, нечитаемый
# файл или неизвестный плейсхолдер — ошибка старта (fail-fast).
# Многострочный текст в YAML НЕ нужен: переносы строк живут в файле как есть.
SYSTEM_PROMPT_FILE: "candidate_context/system_prompt.md"

# Candidate context (база CV) — путь к текстовому файлу с фактами кандидата (legacy-режим).
# ЗАКОММЕНТИРОВАНО на время работ по плану candidate-context-precision-v3.1 (волна 0):
# любой top-level ключ Config переопределяется переменной окружения с тем же именем
# (generic reflection-override, config.go), поэтому оставленный ключ незаметно включает
# legacy-fallback — в prompt уходит весь файл вместо fact-level retrieval.
# Постоянное решение — M0.4/D14 (`allow_legacy_fallback`, default false); сам файл
# переименован в candidate_context.md.bak до конца работ.
# CANDIDATE_CONTEXT_FILE: "candidate_context.md"

# Candidate context — fact-level retrieval (ВКЛЮЧЁН).
# dir: "candidate_context" — локальный lexical retrieval: в prompt попадает
# только профиль + точечно релевантные факты по вопросу.
# dir: "" — legacy-режим: CANDIDATE_CONTEXT_FILE читается целиком.
candidate_context:
  dir: "candidate_context"
  max_tokens: 2000
  max_profile_tokens: 400
  # max_matrix_tokens — бюджет technical_matrix (отдельное поле manifest, не часть
  # profile): при 0 матрица рендерилась бы бюджетом профиля и теряла хвост.
  # 512 (F0, plan fix-plan-2026-11): матрица больше не режется хвостом;
  # постоянное решение — перевод строк матрицы в факты (F6).
  max_matrix_tokens: 512
  min_score: 0
  top_k: 5

# Hints — заготовленные ответы на предсказуемые вопросы интервьюера.
# dir: "hints" — каталог (формат candidate_context) с готовыми ответами;
# при совпадении вопроса подсказка выводится как «Suggested answer (use as is)».
# dir: "" или отсутствие каталога — подсказки выключены.
hints:
  dir: "hints"
  # Строгий порог: score ниже — подсказка не выводится вообще.
  # Калибровка: свои вопросы >= 62, посторонние <= 36.5. 58 — консервативный,
  # более строгий порог между ними: снижает число ложных «use as is»-подсказок.
  # Финальная калибровка — eval-прогон context_eval (.hermes/plans/fix-plan-2026-11.md, F0).
  min_score: 58
  # 2 (F0): до двух подсказок на вопрос; подсказка — «candidate-provided
  # suggestion» и не отменяет факты (правило — в candidate_context/system_prompt.md).
  top_k: 2

# Conversation context — ограничение истории интервью.
conversation:
  # 10 (F0) — расширенная история разговорного контекста (с учётом SpeechLog из F1).
  recent_turns: 10
  max_context_tokens: 4000
  # Реплики интервьюера (SpeechLog, F1): последние 8 финальных фраз уходят в
  # prompt блоком "Interviewer remarks" (бюджет 1500 токенов); также питают
  # Shift+F2-уточнения и автоуточнения после вопроса.
  remarks: 8
  remarks_tokens: 1500
  # auto_answer: false  # вопросы только копятся как метки, ответ по F1
