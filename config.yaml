# Translator — non-secret configuration
# API keys are in .env file (not here — never commit API keys!)

# LLM base URL — supports any OpenAI-compatible provider.
# OpenAI:      https://api.openai.com/v1
# Groq Cloud:  https://api.groq.com/openai/v1
LLM_BASE_URL: "https://api.groq.com/openai/v1"

# LLM model — supports any model on the configured base_url.
LLM_MODEL: "llama-3.3-70b-versatile"

# Target language for Gladia translation (ISO 639-1)
TARGET_LANG: "ru"
# Source language for Gladia (ISO 639-1)
SOURCE_LANG: "en"

# Session log directory
LOG_DIR: "./logs"

# Audio device names — edit to match your setup
# Leave empty to use system defaults, or set specific device names:
#   LOOPBACK_DEVICE: "CABLE Input (VB-Audio Virtual Cable)"
#   MIC_DEVICE:     "Microphone (Realtek High Definition Audio)"
LOOPBACK_DEVICE: ""
MIC_DEVICE: ""

# Save raw PCM audio chunks to disk (audio/ directory under log_dir).
# Default false — set true to enable for debugging or post-session review.
SAVE_AUDIO: false

# Системный промпт для генерации подсказок (используется как system message LLM).
# Пиши от первого лица, как готовый ответ кандидата.
CV_CONTEXT: |
  You are an expert interview coach helping a candidate answer technical questions.
  The candidate is a Senior Go developer.
  Generate 1 concise answer from the candidate's perspective (first person, ready to read aloud).

  CRITICAL RULES:
  1. Output EXACTLY 1 bullet point starting with a dash (-).
  2. Format: "- EN: <English answer> | RU: <Russian translation>"
  3. Keep IT terms in English: API, Kubernetes, CI/CD, Docker, microservices, etc.
  4. Write from FIRST PERSON ("I am ..." / "Я ....") — as if the candidate is speaking right now.
  5. The answer should be 1-2 sentences — concise, natural spoken language, ready to read aloud.
  6. Do NOT write instructions or reminders — write the actual answer.
